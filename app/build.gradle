plugins { id 'com.android.application' }

android {
    namespace 'id.local.tecnovoiceprobe'
    compileSdk 33
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'id.local.tecnovoiceprobe'
        minSdk 26
        targetSdk 33
        versionCode 4
        versionName '0.4.0'
    }
    signingConfigs {
        debug {
            if (project.hasProperty('voxpanelDebugKeystore')) {
                storeFile file(project.property('voxpanelDebugKeystore'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
